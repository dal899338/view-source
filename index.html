<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Expressive Typography</title>
</head>

 <h1> Does the internet build or erase empathy? </h1>   
    <a href="https://alexischateau.com/2020/02/17/does-social-media-build-or-erase-empathy/">WE ARE LOSING EMPATHY</a>
 
  <style> 
    body {
      font-family: helvetica, arial, sans-serif;
      background-color: #928e5f;
      color: #ecc4c4;
      margin: 40px; 
    }

    div {
      font-size: 45px;
      font-weight: bold;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 180px;
      letter-spacing: 20px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .offset {
      margin-left: 180px;
      transform: rotate(-4deg);
    }

    h1 span {
      display: inline-block;
      transform: rotate(12deg);
    }
  </style>
</head>

<body>

  <div> FIRST THINGS FIRST </div>
  <div> FIRST THINGS FIRST </div>
  <div> FIRST THINGS FIRST </div>

 <h1>
F<span>R</span>E<span style="transform: rotate(-12deg);">E</span>
</h1>
  
  <div class="offset"> 
    first things first 
  </div>

</body>
</html>
