<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="utf-8">
 <title> Expressive Typography </title>
 
<style> 
body {
 font-family: helvetica, arial, sans-serif,
 background: color: black;
 color: white;
 margin: 40px; 
}

div {
 font-size; 45px;
 font-weight: bold;
 margin-top; 30px;
 margin-bottom: 30px;
}

 h1 {
  font-size; 180px;
  letter-spacing: 20px;
  margin-top: 20px;
  margin-bottom: 20px;
 }

.offset {
  margin-left; 180px;
  transform: rotate(-4deg);
 }

 h1 span {
  display; inline-block;
  transform; rotate(12deg);
 }
 </style>
 </head>

<body>

 <div> FIRST THINGS FIRST </div>
 <div> FIRST THINGS FIRST </div>
 <div> FIRST THINGS FIRST </div>

  <h1>
   F<span> First </span> First 
  </h1>
  
    <div class= "offset"> first things first </div>

 </body>
</html>
